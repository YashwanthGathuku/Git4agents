name: Reviewer image

# Builds the image reviewers run instead of building the code
# (docker/demo.Dockerfile), proves it inside the image (tests, demo,
# benchmark outcomes) and publishes it to GHCR.
on:
  push:
    tags:
      - "icse27-*"
    branches:
      - icse27-tool-paper
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: docker build -f docker/demo.Dockerfile -t git4agents-demo .

      - name: Tests inside the image
        run: docker run --rm git4agents-demo npm test

      - name: Demo inside the image ends VERIFIED
        run: |
          docker run --rm git4agents-demo | tee demo.log
          tail -n 1 demo.log | grep -qx VERIFIED

      - name: Benchmark inside the image matches the committed outcomes
        run: docker run --rm git4agents-demo node scripts/bench/check-outcomes.mjs

      - name: Publish to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/git4agents"
          tags="${GITHUB_SHA::12}"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then tags="$tags ${GITHUB_REF_NAME}"; fi
          if [ "${GITHUB_REF_TYPE}" = tag ] || [ "${GITHUB_REF_NAME}" = icse27-tool-paper ]; then tags="$tags icse27"; fi
          for t in $tags; do
            docker tag git4agents-demo "$image:$t"
            docker push "$image:$t"
          done
          echo "Published $image with tags: $tags" >> "$GITHUB_STEP_SUMMARY"

      # Reviewers pull without logging in, so the package must be public.
      # A new GHCR package starts private; this step reports which it is.
      - name: Can an anonymous reviewer pull it?
        run: |
          repo="${GITHUB_REPOSITORY_OWNER,,}/git4agents"
          token="$(curl -fsS "https://ghcr.io/token?scope=repository:${repo}:pull" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"
          code="$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${token}" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/${repo}/manifests/${GITHUB_SHA::12}")"
          if [ "$code" = 200 ]; then msg="Anonymous pull works: the package is public."; else msg="Anonymous pull failed (HTTP $code): make the package public in its GitHub settings."; fi
          echo "$msg"; echo "$msg" >> "$GITHUB_STEP_SUMMARY"
