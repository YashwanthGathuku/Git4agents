<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#08111a"/><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f7fafc}.m{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#9fb0bf}.h{font-weight:800}.b{font-weight:700}</style><text x="32" y="58" class="t h" font-size="48">Use cases, actors, and trust boundaries</text><text x="32" y="92" class="m b" font-size="24">Who can do what — and what cannot be bypassed</text><rect x="1500" y="28" width="72" height="42" rx="12" fill="#122433" stroke="#9fb0bf"/><text x="1536" y="56" text-anchor="middle" class="t b" font-size="20">4 / 6</text><rect x="35" y="135" width="420" height="380" rx="18" fill="#0e1a25" stroke="#f6821f"/><text x="55" y="175" class="t b" font-size="24">Untrusted producers</text><text x="75" y="230" class="t b" font-size="20">Parent agent</text><text x="75" y="260" class="m" font-size="17">open contender · compose · coordinate</text><text x="75" y="325" class="t b" font-size="20">Sub-agents</text><text x="75" y="355" class="m" font-size="17">claim scoped work · commit code/tests</text><text x="75" y="420" class="t b" font-size="20">MCP client / IDE</text><text x="75" y="450" class="m" font-size="17">inspect · claim · read ledger · verify permit</text><rect x="500" y="135" width="540" height="380" rx="18" fill="#0e1a25" stroke="#58a6ff" stroke-width="3"/><text x="520" y="175" class="t b" font-size="24">MADGRIX authority boundary</text><text x="545" y="235" class="t b" font-size="21">TaskAuthority + Worker</text><text x="545" y="270" class="m" font-size="17">freeze task · state · ledger · evidence · exact-state authority</text><text x="545" y="380" class="t b" font-size="21">Workflow + trusted Container</text><text x="545" y="415" class="m" font-size="17">apply permit · fast-forward exact SHA · rebase to new SHA</text><rect x="1085" y="135" width="480" height="380" rx="18" fill="#0e1a25" stroke="#a78bfa"/><text x="1105" y="175" class="t b" font-size="24">Independent / downstream</text><text x="1130" y="235" class="t b" font-size="20">Evaluation domain</text><text x="1130" y="265" class="m" font-size="17">read-only candidate + hidden evidence</text><text x="1130" y="335" class="t b" font-size="20">Blind verifiers</text><text x="1130" y="365" class="m" font-size="17">no repo write authority</text><text x="1130" y="435" class="t b" font-size="20">Canonical repo</text><text x="1130" y="465" class="m" font-size="17">only trusted promotion path writes</text><rect x="35" y="555" width="475" height="190" rx="14" fill="#0e1a25" stroke="#58a6ff" stroke-width="2"/><text x="53" y="587" class="t b" font-size="20">1 Collaborative feature build</text><text x="53" y="625" class="m" font-size="17">many sub-agents → one crew fork</text><text x="53" y="655" class="m" font-size="17">COMPOSED → VERIFIED → PROMOTED</text><rect x="545" y="555" width="475" height="190" rx="14" fill="#0e1a25" stroke="#ff5c5c" stroke-width="2"/><text x="563" y="587" class="t b" font-size="20">2 Cheater / tamper attempt</text><text x="563" y="625" class="m" font-size="17">evaluation file modified → QUARANTINED</text><text x="563" y="655" class="m" font-size="17">token revoked → no promotion</text><rect x="1055" y="555" width="475" height="190" rx="14" fill="#0e1a25" stroke="#f6c85f" stroke-width="2"/><text x="1073" y="587" class="t b" font-size="20">3 HEAD moved race</text><text x="1073" y="625" class="m" font-size="17">old permit → EXPIRED_HEAD_MOVED</text><text x="1073" y="655" class="m" font-size="17">rebase → re-evaluate → new permit</text><rect x="28" y="830" width="1544" height="46" rx="12" fill="#122433" stroke="#f6821f"/><text x="800" y="861" text-anchor="middle" class="t b" font-size="23">Mandatory integrity gates cannot be overridden; quarantine is mechanical; proof can be checked offline.</text></svg>