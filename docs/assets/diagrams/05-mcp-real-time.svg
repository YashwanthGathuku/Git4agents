<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#08111a"/><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f7fafc}.m{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#9fb0bf}.mono{font-family:Consolas,monospace;fill:#f7fafc}.h{font-weight:800}.b{font-weight:700}</style><text x="32" y="58" class="t h" font-size="48">MCP in real time</text><text x="32" y="92" class="m b" font-size="24">Agent-safe tools over the same MADGRIX authority plane</text><rect x="1500" y="28" width="72" height="42" rx="12" fill="#122433" stroke="#9fb0bf"/><text x="1536" y="56" text-anchor="middle" class="t b" font-size="20">5 / 6</text><rect x="35" y="135" width="260" height="610" rx="18" fill="#0e1a25" stroke="#58a6ff"/><text x="55" y="175" class="t b" font-size="23">Coding tools</text><g class="t b" font-size="20"><text x="70" y="245">Claude Code</text><text x="70" y="335">Cursor</text><text x="70" y="425">VS Code</text><text x="70" y="515">Any MCP client</text></g><text x="70" y="570" class="m" font-size="17">authenticated to the Worker</text><rect x="335" y="135" width="360" height="610" rx="18" fill="#0e1a25" stroke="#f6821f"/><text x="355" y="175" class="t b" font-size="23">POST /mcp on Worker</text><g class="mono" font-size="19"><text x="380" y="235">inspect_task</text><text x="380" y="300">inspect_work_graph</text><text x="380" y="365">check_clearance</text><text x="380" y="430">claim_work</text><text x="380" y="495">open_contender</text><text x="380" y="560">read_ledger</text><text x="380" y="625">verify_permit</text></g><rect x="735" y="135" width="400" height="610" rx="18" fill="#0e1a25" stroke="#a78bfa"/><text x="755" y="175" class="t b" font-size="23">Shared system state</text><text x="780" y="245" class="t b" font-size="20">TaskAuthority DO</text><text x="780" y="275" class="m" font-size="17">claims · identities · conflict reports</text><text x="780" y="355" class="t b" font-size="20">Work graph + clearance</text><text x="780" y="385" class="m" font-size="17">scopes · overlaps · dependencies</text><text x="780" y="465" class="t b" font-size="20">Artifacts contender state</text><text x="780" y="495" class="m" font-size="17">fork metadata · candidate SHA</text><text x="780" y="575" class="t b" font-size="20">Ledger + permit</text><text x="780" y="605" class="m" font-size="17">events · exact-state authority</text><rect x="1175" y="135" width="390" height="610" rx="18" fill="#0e1a25" stroke="#3ddc97"/><text x="1195" y="175" class="t b" font-size="23">Live loop</text><g class="t b" font-size="18"><text x="1220" y="235">1 Inspect task + graph</text><text x="1220" y="305">2 Check clearance</text><text x="1220" y="375">3 Claim scoped work</text><text x="1220" y="445">4 Code / test / commit</text><text x="1220" y="515">5 Push → Queue → authority</text><text x="1220" y="585">6 Re-inspect ledger / graph</text><text x="1220" y="655">7 Verify permit if present</text></g><rect x="335" y="765" width="1230" height="55" rx="12" fill="#2a1216" stroke="#ff5c5c"/><text x="950" y="800" text-anchor="middle" class="t b" font-size="20">No MCP tool can promote, issue permits, submit verdicts/evidence, rebase authority, or write canonical Git.</text><rect x="28" y="830" width="1544" height="46" rx="12" fill="#122433" stroke="#f6821f"/><text x="800" y="861" text-anchor="middle" class="t b" font-size="23">MCP is an agent interface — not a second policy or privilege path.</text></svg>