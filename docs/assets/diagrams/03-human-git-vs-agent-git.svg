<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#08111a"/><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f7fafc}.m{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#9fb0bf}.h{font-weight:800}.b{font-weight:700}</style><text x="32" y="58" class="t h" font-size="48">Human Git → Git for autonomous agents</text><text x="32" y="92" class="m b" font-size="24">Why the operating assumptions change</text><rect x="1500" y="28" width="72" height="42" rx="12" fill="#122433" stroke="#9fb0bf"/><text x="1536" y="56" text-anchor="middle" class="t b" font-size="20">3 / 6</text><rect x="35" y="135" width="475" height="645" rx="18" fill="#0e1a25" stroke="#58a6ff" stroke-width="3"/><text x="57" y="175" class="t b" font-size="25">Human-era Git / GitHub</text><rect x="545" y="135" width="475" height="645" rx="18" fill="#0e1a25" stroke="#ff5c5c" stroke-width="3"/><text x="567" y="175" class="t b" font-size="25">Agent-era failure modes</text><rect x="1055" y="135" width="475" height="645" rx="18" fill="#0e1a25" stroke="#3ddc97" stroke-width="3"/><text x="1077" y="175" class="t b" font-size="25">MADGRIX / Git4agents</text><g class="t b" font-size="18"><text x="70" y="235">Identity / branch permissions</text><text x="70" y="325">PR + social review</text><text x="70" y="415">CI after candidate exists</text><text x="70" y="505">Merge conflicts</text><text x="70" y="595">Git history</text><text x="70" y="685">Human reviewers</text><text x="580" y="235">Mass concurrency</text><text x="580" y="325">False “done”</text><text x="580" y="415">Evaluation tampering</text><text x="580" y="505">Stale HEAD races</text><text x="580" y="595">Evidence overload</text><text x="580" y="685">Actor allowed ≠ state safe</text><text x="1090" y="235">WorkClaims</text><text x="1090" y="325">Independent evaluation</text><text x="1090" y="415">Blind verification</text><text x="1090" y="505">Verdict seam</text><text x="1090" y="595">CanonCap / exact-state permit</text><text x="1090" y="685">Signed proof</text></g><g class="m" font-size="16"><text x="70" y="263">who may merge</text><text x="70" y="353">humans infer intent</text><text x="70" y="443">tests assumed trustworthy</text><text x="70" y="533">often discovered late</text><text x="70" y="623">proves what changed</text><text x="70" y="713">final trust boundary</text><text x="580" y="263">100s–1000s of agents</text><text x="580" y="353">claim ≠ evidence</text><text x="580" y="443">agent can edit tests</text><text x="580" y="533">state changes after review</text><text x="580" y="623">too much for manual review</text><text x="580" y="713">identity permission is insufficient</text><text x="1090" y="263">intent + scoped ownership</text><text x="1090" y="353">exact immutable SHA</text><text x="1090" y="443">commit → reveal → sign</text><text x="1090" y="533">non-compensatory gates</text><text x="1090" y="623">state-specific, single use</text><text x="1090" y="713">hash-chain + DSSE offline verify</text></g><rect x="28" y="830" width="1544" height="46" rx="12" fill="#122433" stroke="#f6821f"/><text x="800" y="861" text-anchor="middle" class="t b" font-size="23">Git decides ancestry. MADGRIX decides canonicality — why one exact state earned the right to ship.</text></svg>