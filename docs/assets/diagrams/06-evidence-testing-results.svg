ive WorkClaim coordination</text><g class="t b" font-size="18"><text x="60" y="450">100</text><text x="700" y="450">100 / 100</text><text x="60" y="500">1,000</text><text x="700" y="500">1,000 / 1,000</text><text x="60" y="550">2,000</text><text x="700" y="550">2,000 / 2,000</text><text x="60" y="600">3,000</text><text x="700" y="600">3,000 / 3,000</text><text x="60" y="650">5,000</text><text x="700" y="650">4,997 / 5,000</text></g><g fill="#58a6ff"><rect x="160" y="432" width="520" height="22" rx="6"/><rect x="160" y="482" width="520" height="22" rx="6"/><rect x="160" y="532" width="520" height="22" rx="6"/><rect x="160" y="582" width="520" height="22" rx="6"/><rect x="160" y="632" width="519" height="22" rx="6"/></g><text x="60" y="690" class="t b" font-size="18">249 / 249 seeded overlaps flagged · 0 false flags · ledger OK</text><rect x="845" y="350" width="720" height="165" rx="16" fill="#0e1a25" stroke="#ff5c5c"/><text x="865" y="390" class="t b" font-size="24">Adversarial outcomes</text><g class="m" font-size="17"><text x="865" y="428">eval tampering → QUARANTINED · wrong baseline → FINAL FALSIFIED</text><text x="865" y="458">moved HEAD → EXPIRED_HEAD_MOVED · bundle tampering → NOT VERIFIED</text><text x="865" y="488">26 / 26 blocked · 0 unauthorized promotions</text></g><rect x="845" y="545" width="720" height="165" rx="16" fill="#0e1a25" stroke="#a78bfa"/><text x="865" y="585" class="t b" font-size="24">Module memory</text><g class="m" font-size="17"><text x="865" y="623">184 files / 11 modules</text><text x="865" y="653">after one edit: reread 25 / 184 files = 13.6%</text><text x="865" y="683">1 module reread · 10 module cards reused · deterministic + model-free</text></g><rect x="28" y="830" width="1544" height="46" rx="12" fill="#122433" stroke="#f6821f"/><text x="800" y="861" text-anchor="middle" class="t b" font-size="22">5,000-agent figures measure coordination; the 13-agent crew measures real commit → composition → promotion.</text></svg>