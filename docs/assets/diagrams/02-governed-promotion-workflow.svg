<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#08111a"/><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f7fafc}.m{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#9fb0bf}.h{font-weight:800}.b{font-weight:700}</style><text x="32" y="58" class="t h" font-size="48">How MADGRIX works</text><text x="32" y="92" class="m b" font-size="24">End-to-end governed promotion workflow</text><rect x="1500" y="28" width="72" height="42" rx="12" fill="#122433" stroke="#9fb0bf"/><text x="1536" y="56" text-anchor="middle" class="t b" font-size="20">2 / 6</text><g font-family="Inter,Segoe UI,Arial,sans-serif"><g fill="#0e1a25" stroke="#f6821f" stroke-width="2"><rect x="35" y="150" width="200" height="150" rx="14"/><rect x="250" y="150" width="200" height="150" rx="14"/><rect x="465" y="150" width="200" height="150" rx="14"/><rect x="680" y="150" width="200" height="150" rx="14"/><rect x="895" y="150" width="200" height="150" rx="14"/><rect x="1110" y="150" width="200" height="150" rx="14"/><rect x="1325" y="150" width="200" height="150" rx="14"/></g><g fill="#0e1a25" stroke="#58a6ff" stroke-width="2"><rect x="35" y="430" width="200" height="150" rx="14"/><rect x="250" y="430" width="200" height="150" rx="14"/><rect x="465" y="430" width="200" height="150" rx="14"/><rect x="680" y="430" width="200" height="150" rx="14"/></g><g fill="#0e1a25" stroke="#3ddc97" stroke-width="2"><rect x="895" y="430" width="200" height="150" rx="14"/><rect x="1110" y="430" width="200" height="150" rx="14"/><rect x="1325" y="430" width="200" height="150" rx="14"/></g></g><g class="t b" font-size="19"><text x="53" y="185">1 Freeze task</text><text x="268" y="185">2 Verifiers commit</text><text x="483" y="185">3 Parent forks once</text><text x="698" y="185">4 WorkClaims</text><text x="913" y="185">5 Parallel commits</text><text x="1128" y="185">6 Compose</text><text x="1343" y="185">7 Push event</text><text x="53" y="465">8 Evaluate</text><text x="268" y="465">9 Blind reports</text><text x="483" y="465">10 TheUstad</text><text x="698" y="465">11 Verdict seam</text><text x="913" y="465">12 Exact permit</text><text x="1128" y="465">13 Promote</text><text x="1343" y="465">14 Prove</text></g><g class="m" font-size="16"><text x="53" y="225">intent + baseline + policy</text><text x="268" y="225">before candidate exposure</text><text x="483" y="225">one governed Artifacts fork</text><text x="698" y="225">scope + intent + lease</text><text x="913" y="225">sub-agents on crew fork</text><text x="1128" y="225">COMPOSED / CONFLICTED</text><text x="1343" y="225">Artifacts → Queue → DO</text><text x="53" y="505">mandatory gates on exact SHA</text><text x="268" y="505">reveal + sign</text><text x="483" y="505">frozen-baseline done gate</text><text x="698" y="505">ACCEPT / REJECT</text><text x="913" y="505">single-use candidate authority</text><text x="1128" y="505">Workflow + Container</text><text x="1343" y="505">DSSE bundle → offline verify</text></g><rect x="35" y="635" width="960" height="150" rx="16" fill="#0e1a25" stroke="#f6c85f"/><text x="55" y="680" class="t b" font-size="24">Key invariant</text><text x="55" y="725" class="t h" font-size="30">reviewed SHA = permitted SHA = shipped SHA</text><text x="55" y="758" class="m" font-size="18">If state changes, old authority cannot authorize the new state.</text><rect x="1040" y="635" width="530" height="150" rx="16" fill="#0e1a25" stroke="#ff5c5c"/><text x="1060" y="680" class="t b" font-size="22">Fail-closed paths</text><text x="1060" y="715" class="m" font-size="17">eval tamper → QUARANTINED · gate failure → REJECTED</text><text x="1060" y="748" class="m" font-size="17">HEAD moved → EXPIRED_HEAD_MOVED → new evidence</text><rect x="28" y="830" width="1544" height="46" rx="12" fill="#122433" stroke="#f6821f"/><text x="800" y="861" text-anchor="middle" class="t b" font-size="23">Only the exact evaluated and permitted software state may become canonical.</text></svg>