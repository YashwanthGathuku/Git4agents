<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="#08111a"/><style>.t{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#f7fafc}.m{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#9fb0bf}.h{font-weight:800}.b{font-weight:700}</style><text x="32" y="58" class="t h" font-size="48">MADGRIX / Git4agents</text><text x="32" y="92" class="m b" font-size="24">Cloudflare-native architecture for autonomous software agents</text><rect x="1500" y="28" width="72" height="42" rx="12" fill="#122433" stroke="#9fb0bf"/><text x="1536" y="56" text-anchor="middle" class="t b" font-size="20">1 / 6</text><rect x="30" y="125" width="250" height="650" rx="18" fill="#0e1a25" stroke="#58a6ff"/><text x="52" y="160" class="t b" font-size="24">Actors</text><text x="70" y="235" class="t b" font-size="21">Parent agent</text><text x="70" y="270" class="m" font-size="17">plans · coordinates · REST / MCP</text><text x="70" y="390" class="t b" font-size="21">Sub-agents (N)</text><text x="70" y="425" class="m" font-size="17">claim work · commit contender state</text><text x="70" y="545" class="t b" font-size="21">Coding tools / MCP</text><text x="70" y="580" class="m" font-size="17">Claude Code · Cursor · VS Code</text><rect x="320" y="125" width="910" height="650" rx="18" fill="none" stroke="#f6821f" stroke-width="3"/><text x="342" y="160" class="t b" font-size="24">Cloudflare runtime</text><g class="t b" font-size="21"><text x="380" y="235">Workers</text><text x="680" y="235">TaskAuthority DO</text><text x="380" y="465">Artifacts</text><text x="680" y="465">Queues</text><text x="965" y="465">Workflows</text><text x="965" y="635">Containers</text><text x="680" y="635">ModuleAgent DO</text></g><g class="m" font-size="16"><text x="380" y="270">REST · /mcp · /replay · /board</text><text x="680" y="270">frozen task · WorkClaims · ledger</text><text x="680" y="295">evaluations · verdicts · permits</text><text x="380" y="500">canonical repo + contender forks</text><text x="680" y="500">madgrix-events · push events</text><text x="965" y="500">madgrix-promotion · one per permit</text><text x="965" y="670">promote.sh / rebase.sh · canonical writer</text><text x="680" y="670">deterministic per-module memory</text></g><g stroke="#58a6ff" stroke-width="4" fill="none"><path d="M280 260H320"/><path d="M280 420H360V485"/><path d="M575 485H645"/><path d="M770 430V315"/><path d="M925 275H1260"/><path d="M890 485H930"/><path d="M1050 540V590"/><path d="M930 690H585V520"/></g><rect x="1260" y="125" width="310" height="650" rx="18" fill="#0e1a25" stroke="#a78bfa"/><text x="1282" y="160" class="t b" font-size="24">Independent trust / proof</text><text x="1300" y="235" class="t b" font-size="20">Evaluation domain</text><text x="1300" y="270" class="m" font-size="16">exact baseline · scope · hidden oracle</text><text x="1300" y="295" class="m" font-size="16">no tampering · security · semantics</text><text x="1300" y="395" class="t b" font-size="20">Blind verifiers</text><text x="1300" y="430" class="m" font-size="16">commit → reveal → sign</text><text x="1300" y="535" class="t b" font-size="20">Ed25519 DSSE bundle</text><text x="1300" y="570" class="m" font-size="16">ledger head + exact shipped SHA</text><text x="1300" y="675" class="t b" font-size="20">Offline verify</text><text x="1300" y="710" class="m" font-size="16">out-of-band pinned public key</text><rect x="28" y="830" width="1544" height="46" rx="12" fill="#122433" stroke="#f6821f"/><text x="800" y="861" text-anchor="middle" class="t b" font-size="23">Cloudflare provides the runtime; MADGRIX provides the canonicality protocol and authority separation.</text></svg>